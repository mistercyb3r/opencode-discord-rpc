<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode Discord Rich Presence</title>
  <desc id="desc">A purple neon terminal and Discord presence card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#100b2b"/><stop offset="0.55" stop-color="#24104f"/><stop offset="1" stop-color="#0b172d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="90" cy="40" r="130" fill="#7c3aed" opacity=".24" filter="url(#blur)"/>
  <circle cx="1110" cy="330" r="150" fill="#06b6d4" opacity=".18" filter="url(#blur)"/>
  <g filter="url(#shadow)">
    <rect x="65" y="66" width="430" height="228" rx="18" fill="#0a1020" stroke="#5b4bb7" stroke-width="2"/>
    <circle cx="98" cy="98" r="7" fill="#fb7185"/><circle cx="121" cy="98" r="7" fill="#fbbf24"/><circle cx="144" cy="98" r="7" fill="#34d399"/>
    <path d="M105 160l34 28-34 28M161 224h55" fill="none" stroke="url(#glow)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="268" y="145" width="160" height="12" rx="6" fill="#334155"/><rect x="268" y="176" width="115" height="12" rx="6" fill="#334155"/><rect x="268" y="207" width="142" height="12" rx="6" fill="#334155"/>
  </g>
  <path d="M535 181h70" stroke="url(#glow)" stroke-width="4" stroke-linecap="round"/><circle cx="620" cy="181" r="7" fill="#22d3ee"/>
  <g filter="url(#shadow)">
    <rect x="670" y="75" width="460" height="210" rx="20" fill="#111827" stroke="#5865f2" stroke-width="2"/>
    <circle cx="720" cy="126" r="27" fill="#5865f2"/>
    <path d="M705 126c4-12 26-12 30 0v18c-5 4-25 4-30 0zM711 126h18M712 138h4M724 138h4" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <text x="765" y="119" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="700">OpenCode Programming</text>
    <text x="765" y="153" fill="#cbd5e1" font-family="monospace" font-size="17">TypeScript · Next.js</text>
    <text x="765" y="181" fill="#94a3b8" font-family="monospace" font-size="16">my-project · main · 7 changed</text>
    <rect x="705" y="222" width="112" height="28" rx="8" fill="#5865f2"/><text x="722" y="241" fill="white" font-family="sans-serif" font-size="13" font-weight="700">OpenCode</text>
    <rect x="829" y="222" width="150" height="28" rx="8" fill="#26324b"/><text x="847" y="241" fill="#cbd5e1" font-family="sans-serif" font-size="13">View on GitHub</text>
  </g>
  <text x="65" y="335" fill="#c4b5fd" font-family="sans-serif" font-size="16" letter-spacing="3">CODE · CONTEXT · PRESENCE</text>
</svg>
