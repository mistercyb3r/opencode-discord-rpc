name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo apt-get update && sudo apt-get install --yes sqlite3
      - run: npm ci
      - run: node --check index.js
      - run: bash -n install.sh
      - run: test -f opencode-rpc.service
